<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agents 控制 · MolaTube</title><link rel="stylesheet" href="styles.css"><link rel="icon" href="icon.webp"></head>
<body><header><div class="logo"><img src="icon.webp" alt="" style="height:22px;vertical-align:middle;border-radius:6px"> Mola<b>Tube</b></div><nav class="nav"><a href="index.html">首页</a><a href="workbench.html">Agent 工作台</a><a class="on" href="agents.html">Agents 控制</a><a href="dashboard.html">控制面板</a><a href="browser.html">浏览器</a></nav></header>
<main class="main"><h2>Agents 控制</h2><p class="note" id="mode"></p>
<div class="panel" id="health"><h3>系统负载</h3><div id="healthBody" class="note">加载中…</div></div>
<div class="panel"><h3>新建 Agent（你主动创建）</h3><input id="agentName" placeholder="名字（可选）"> <select id="agentVideo"></select> <select id="agentType"><option value="summary">视频总结</option><option value="qa">针对视频答疑</option><option value="notes">整理笔记</option><option value="quiz">生成自测题（自学用）</option></select> <button class="btn" onclick="createAgent()">创建</button><p class="note">一个 agent 一次只跑一个任务；暂停 = 跑完当前任务后不再起新任务；失败或中断的 agent 会标为“等你处理”，由你点重试，不自动重跑。答疑任务会用该 agent 的最新备注当问题。</p></div>
<h3>等你处理的 Agent</h3><div id="waiting"></div>
<h3>全部 Agents</h3><div id="agents"></div>
<div class="panel"><h3>审计记录</h3><div id="audit" class="note"></div></div></main>
<script src="app.js"></script><script src="agents.js"></script></body></html>
