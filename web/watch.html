<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>观看 · MolaTube</title><link rel="stylesheet" href="styles.css"><link rel="icon" href="icon.webp"></head>
<body><header><div class="logo">Mola<b>Tube</b></div><div class="search"><input id="q" placeholder="搜你想学的视频…"><button onclick="search()">搜索</button></div><nav class="nav"><a href="index.html">首页</a><a href="workbench.html">Agent 工作台</a><a href="agents.html">Agents 控制</a><a href="dashboard.html">控制面板</a></nav></header>
<main class="main"><div class="watch"><div><div class="player"><video id="player" controls></video></div><h2 id="vtitle"></h2><p class="note" id="vdesc"></p><p class="note">进度只记录你真实的观看行为，不自动播放、不代刷。</p></div>
<aside><div class="panel"><h3>让 Agent 帮你</h3><p class="note">选一个你主动发起的任务，Agent 会在独立工作区里做，结果只给你看。</p><select id="jobVideo"></select><br><br><select id="jobType"><option value="summary">视频总结</option><option value="qa">针对视频答疑</option><option value="notes">整理笔记</option><option value="quiz">生成自测题（自学用）</option></select><br><br><button class="btn" onclick="quickJob()">提交任务 →</button></div>
<div class="panel"><h3>本页说明</h3><p class="note">不登录任何第三方学习平台，不代做作业、不代答考试。需要帮助时去工作台提交任务并随时取消。</p></div></aside></div></main>
<script src="app.js"></script><script>function quickJob(){const v=document.getElementById("jobVideo").value;const t=document.getElementById("jobType").value;localStorage.setItem("molatube_pending",JSON.stringify({videoId:v,type:t}));location.href="workbench.html";}</script></body></html>
